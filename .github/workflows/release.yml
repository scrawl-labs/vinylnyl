name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
          - os: windows-latest
            script: dist:win
          - os: ubuntu-latest
            script: dist:linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: electron-widget
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: electron-widget/package-lock.json
      - run: npm ci
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            electron-widget/dist/Vinylnyl.dmg
            electron-widget/dist/Vinylnyl-Setup.exe
            electron-widget/dist/Vinylnyl.AppImage
          body_path: RELEASE_NOTES.md
          name: Vinylnyl ${{ github.ref_name }}

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cd extension && zip -r ../vinylnyl-extension.zip . -x '.*'
      - uses: softprops/action-gh-release@v2
        with:
          files: vinylnyl-extension.zip
          body_path: RELEASE_NOTES.md
          name: Vinylnyl ${{ github.ref_name }}
